name: Pipeline

on:
  push:
    branches: ["main"]
    paths: 
      - "blog/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths: 
      - "blog/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: blog

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy_db
      SECRET_KEY_BASE: AzSYdvZj1lvYKuQD4ejEVHeo1FyMMflbzNw4Hhn7yDQ6AKithgnhJnNNJQgOFhQl

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.0"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: blog/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('blog/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Check Formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Set up database
        run: mix ecto.setup

      - name: Run tests
        run: mix test

      - name: Build assets
        run: |
          MIX_ENV=prod mix assets.deploy

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    # Only deploy on pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
